# Builds the debug APK on GitHub's servers every time you push (or when you
# click "Run workflow"). Download it from the run's "Artifacts" section.
# Builds of the main branch are also published as a GitHub release, so the
# newest APK is always at:
# https://github.com/markybadz/Weathercheck/releases/latest/download/SimpleWeather.apk
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleWeather-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimpleWeather.apk
          gh release create "build-${{ github.run_number }}" SimpleWeather.apk \
            --target "${{ github.sha }}" \
            --title "Simple Weather build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Download SimpleWeather.apk below and open it on your Android phone (Android 8.0 or newer)." \
            --latest
